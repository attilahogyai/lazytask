[project]
name = "task-log"
version = "0.1.0"
description = "Terminal task/time log viewer"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60,<1.0",
    "requests>=2.31,<3",
    "pathspec>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
